name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Checks and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check server modules
        run: npm run check

      - name: Check browser modules
        run: |
          for file in web/js/*.js web/js/views/*.js; do
            node --check "$file"
          done

      - name: Run end-to-end API tests
        run: npm test
